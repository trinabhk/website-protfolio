name: Resubmit sitemap to Google Search Console

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  resubmit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: trinabhs-portfolio
          workload_identity_provider: projects/939144598273/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: gsc-sitemap-bot@trinabhs-portfolio.iam.gserviceaccount.com

      - name: Install googleapis
        run: npm install googleapis@144

      - name: Resubmit sitemap
        run: node scripts/resubmit-sitemap.js
