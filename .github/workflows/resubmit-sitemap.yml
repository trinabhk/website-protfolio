name: Resubmit sitemap to Google Search Console

on:
  push:
    branches: [master]

jobs:
  resubmit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install googleapis
        run: npm install googleapis@144

      - name: Resubmit sitemap
        env:
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
        run: node scripts/resubmit-sitemap.js
